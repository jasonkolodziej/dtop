name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-15
          - name: Windows
            os: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Swift (Linux)
        if: runner.os == 'Linux'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      # Swift 6.0.x cannot build the `ucrt` module against the Windows 11 SDK (10.0.26100)
      # that the runner image ships, so Windows uses a newer toolchain. The package still
      # declares swift-tools-version 6.0.
      - name: Set up Swift (Windows)
        if: runner.os == 'Windows'
        # Pinned to the commit of compnerd/gha-setup-swift `main` this workflow was validated with
        # (2026-11-07); bump deliberately.
        uses: compnerd/gha-setup-swift@57fe462cd3c7b05ae8fcff79b00719312e305257
        with:
          branch: swift-6.2-release
          tag: 6.2-RELEASE

      # macOS runners ship Xcode 16+, whose toolchain already speaks Swift 6.
      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      # The TLS tests mint certificates and run `openssl s_server`; every runner image has the
      # openssl tool (Git for Windows ships one), and DTOP_REQUIRE_TLS_TESTS turns a missing tool
      # into a failure instead of a skip.
      - name: Show openssl
        shell: bash
        run: command -v openssl && openssl version

      - name: Test
        env:
          DTOP_REQUIRE_TLS_TESTS: "1"
        run: swift test

      # macOS gives secondary threads 512 KB stacks while Linux defaults to 8 MB, so a debug
      # build with an oversized stack frame only crashes on macOS. Catch that on Linux too.
      - name: Test with macOS-sized thread stacks (512 KB)
        if: runner.os == 'Linux'
        env:
          DTOP_REQUIRE_TLS_TESTS: "1"
        run: bash -c 'ulimit -s 512 && .build/debug/dtopPackageTests.xctest --testing-library swift-testing'

      # GitHub's Linux runners have a Docker daemon, so exercise the real Engine API there.
      - name: Integration tests (real Docker daemon)
        if: runner.os == 'Linux'
        env:
          DTOP_INTEGRATION: "1"
        run: swift test --filter Integration

      - name: Smoke test the executable
        shell: bash
        run: |
          swift run dtop --version
          swift run dtop --help > /dev/null
          swift run dtop --list-themes

      - name: Smoke test --once against Docker (Linux)
        if: runner.os == 'Linux'
        run: swift run dtop --once

      # A real TLS daemon: docker:dind generates a CA, server and client certificates in
      # /certs and listens on 2376 with --tlsverify. dtop connects the way the Docker CLI would.
      - name: Smoke test --once against a TLS Docker daemon (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/dind-certs"
          docker run -d --name dtop-dind --privileged -p 127.0.0.1:2376:2376 \
            -e DOCKER_TLS_CERTDIR=/certs -v "$RUNNER_TEMP/dind-certs:/certs" docker:27-dind
          for i in $(seq 1 60); do
            [ -f "$RUNNER_TEMP/dind-certs/client/key.pem" ] && \
              docker --host tcp://127.0.0.1:2376 --tlsverify --tlscacert "$RUNNER_TEMP/dind-certs/client/ca.pem" \
                --tlscert "$RUNNER_TEMP/dind-certs/client/cert.pem" --tlskey "$RUNNER_TEMP/dind-certs/client/key.pem" \
                version > /dev/null 2>&1 && break
            sleep 2
          done
          sudo chmod -R a+r "$RUNNER_TEMP/dind-certs"
          docker --host tcp://127.0.0.1:2376 --tlsverify --tlscacert "$RUNNER_TEMP/dind-certs/client/ca.pem" \
            --tlscert "$RUNNER_TEMP/dind-certs/client/cert.pem" --tlskey "$RUNNER_TEMP/dind-certs/client/key.pem" \
            run -d --name tls-probe alpine:3.20 sleep 600
          DOCKER_HOST=tcp://localhost:2376 DOCKER_TLS_VERIFY=1 DOCKER_CERT_PATH="$RUNNER_TEMP/dind-certs/client" \
            swift run dtop --once | tee "$RUNNER_TEMP/tls-once.txt"
          grep -q tls-probe "$RUNNER_TEMP/tls-once.txt"

  lint-and-validate:
    name: Lint & Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install YAML validator dependency
        run: python3 -m pip install --disable-pip-version-check --user pyyaml

      - name: Validate YAML files
        run: |
          find . -type f \( -name "*.yml" -o -name "*.yaml" \) \
            -not -path "*/.git/*" \
            -not -path "*/node_modules/*" \
            -not -path "*/dist/*" \
            -not -path "*/vendor/*" \
            | while read -r f; do
              python3 -c "import yaml, pathlib; yaml.safe_load(pathlib.Path('$f').read_text())" \
                && echo "OK: $f" \
                || { echo "INVALID: $f"; exit 1; }
            done

      - name: Check for secret patterns
        run: |
          # Basic check to avoid accidentally committing common secret patterns.
          # Extend this list as needed for your project.
          if grep -rn \
            --include="*.yml" --include="*.yaml" --include="*.json" \
            --exclude-dir=".git" --exclude-dir="node_modules" --exclude-dir="dist" --exclude-dir="vendor" \
            --exclude="package-lock.json" --exclude="pnpm-lock.yaml" --exclude="yarn.lock" \
            -E "(password|secret|api_key|token)\s*[:=]\s*['\"]?[A-Za-z0-9+/]{20,}" \
            .; then
            echo "Potential secret detected in committed files."
            exit 1
          fi
          echo "No secret patterns found."

      - name: Check Swift sources for trailing whitespace
        run: |
          if grep -rnE "[[:space:]]+$" --include="*.swift" Sources Tests; then
            echo "Trailing whitespace found (see lines above)."
            exit 1
          fi
          echo "No trailing whitespace."
